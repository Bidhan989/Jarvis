[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openjarvis"
version = "0.1.0"
description = "Modular local-first personal AI assistant framework"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "click>=8",
  "croniter>=2.0",
  "httpx>=0.27",
  "openai>=1.30",
  "pyyaml>=6.0",
  "rich>=13",
  "tomlkit>=0.12",
  "websockets>=12",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.30", "pydantic>=2.0", "python-multipart>=0.0.9"]
cloud = ["anthropic>=0.30", "google-genai>=1.0"]
pdf = ["pdfplumber>=0.10"]
browser = ["playwright>=1.40"]
memory = ["numpy>=1.24", "sentence-transformers>=2.2", "faiss-cpu>=1.7", "rank-bm25>=0.2.2"]
speech = ["faster-whisper>=1.0", "numpy>=1.24", "sounddevice>=0.5", "soundfile>=0.12"]
channels = ["python-telegram-bot>=21.0", "discord.py>=2.3", "slack-sdk>=3.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.22", "ruff>=0.4", "numpy>=1.24"]

[project.scripts]
jarvis = "openjarvis.cli:main"
openjarvis-eval = "openjarvis.evals.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: needs real services or credentials",
  "cloud: needs cloud API keys",
  "slow: long-running test",
  "apple: Apple hardware only",
  "nvidia: NVIDIA GPU only",
]